# Cloudflare Workers + Durable Objects deployment config for the
# cloudflare-migration branch (see the migration plan). This coexists
# with, and is entirely unrelated to, the AWS-side Dockerfile/infra/*.tf
# — nothing here is read by the AWS deploy pipeline.
name = "escape-pod-cf"
main = "src/worker.ts"
compatibility_date = "2026-07-28"
# Needed for src/util/jwt.ts's Buffer usage (reused unchanged from the
# AWS side, per the migration plan). Also covers node:crypto's
# createCipheriv/createDecipheriv (crypto/tokenCrypto.ts) — confirmed
# empirically under real local workerd during Phase 4 (a Phase 0-era
# comment here previously claimed these were NOT covered by this flag;
# that was wrong, or at least stale — Cloudflare has since expanded
# nodejs_compat's node:crypto coverage). Phase 6 (Web Crypto rewrite) may
# turn out to be unnecessary as a result — revisit before starting it.
compatibility_flags = ["nodejs_compat"]

# Phase 9: the SAME Discord Application the AWS deployment already uses
# (not a second, throwaway one — see the migration plan's Phase 9 section
# and the plan's own open question about this) — these two values are
# meant to be public (DISCORD_PUBLIC_KEY verifies webhook signatures;
# DISCORD_APPLICATION_ID just identifies the app), safe to commit here.
# The real secrets (DISCORD_BOT_TOKEN, TOKEN_ENCRYPTION_KEY) are set via
# `wrangler secret put`, never written to this file. Reusing the existing
# app means this Worker can only receive real Discord traffic while the
# app's Interactions Endpoint URL actually points at it — Discord allows
# only one URL per application, so testing this deployment means
# temporarily pointing that URL here, away from the AWS ALB, then
# pointing it back once done.
[vars]
DISCORD_APPLICATION_ID = "1524918902373744650"
DISCORD_PUBLIC_KEY = "a886a9e18825b14110039efc4b33ce4a7e959a9fb320f45315dae461dc2da01c"
PTP_BASE_URL = "https://www.protectthepod.com"

[[durable_objects.bindings]]
name = "ESCAPE_POD_DO"
class_name = "EscapePodDurableObject"

# Matches durableObject.ts's POD_SWEEP_CRON/TOKEN_REFRESH_CRON literals
# exactly — worker.ts's scheduled() handler dispatches on event.cron, so
# these two strings have to stay in sync with those constants. One-minute
# covers expirePodRounds+retryFailedFires (they already share a 60s
# interval on the AWS side); daily covers refreshTokens.
[triggers]
crons = ["*/1 * * * *", "0 0 * * *"]

# Declares EscapePodDurableObject as SQLite-storage-backed. Cloudflare's
# docs mark this classic `[[migrations]]` form as legacy in favor of a
# newer `[exports.ClassName]` declarative form — but @cloudflare/
# vitest-pool-workers' local Miniflare/workerd simulation (confirmed
# empirically, not just from docs) does not yet recognize the `exports`
# form and fails every real-DO test with "SQL is not enabled for this
# Durable Object class." This classic form works correctly for both a
# real `wrangler deploy` and local `vitest-pool-workers` testing, so it's
# the one actually used here — revisit once local testing support for
# `exports` catches up.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["EscapePodDurableObject"]
