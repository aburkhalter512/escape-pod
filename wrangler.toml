# Cloudflare Workers + Durable Objects deployment config for the
# cloudflare-migration branch (see the migration plan). This coexists
# with, and is entirely unrelated to, the AWS-side Dockerfile/infra/*.tf
# — nothing here is read by the AWS deploy pipeline.
name = "escape-pod-cf"
main = "src/worker.ts"
compatibility_date = "2026-07-28"
# Needed for src/util/jwt.ts's Buffer usage (reused unchanged from the
# AWS side, per the migration plan) — Workers doesn't have Buffer as a
# true global without this flag. node:crypto's stream-cipher APIs
# (createCipheriv/createDecipheriv) are NOT covered by this flag, which
# is why tokenCryptoWorkers.ts (Phase 6) uses Web Crypto instead.
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "ESCAPE_POD_DO"
class_name = "EscapePodDurableObject"

# Declares EscapePodDurableObject as SQLite-storage-backed. Cloudflare's
# docs mark this classic `[[migrations]]` form as legacy in favor of a
# newer `[exports.ClassName]` declarative form — but @cloudflare/
# vitest-pool-workers' local Miniflare/workerd simulation (confirmed
# empirically, not just from docs) does not yet recognize the `exports`
# form and fails every real-DO test with "SQL is not enabled for this
# Durable Object class." This classic form works correctly for both a
# real `wrangler deploy` and local `vitest-pool-workers` testing, so it's
# the one actually used here — revisit once local testing support for
# `exports` catches up.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["EscapePodDurableObject"]
