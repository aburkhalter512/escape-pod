name: Deploy Cloudflare

# Triggered by the CI workflow succeeding on main, rather than its own
# push trigger — mirrors deploy-app.yml's exact pattern, so both
# platforms only ever deploy code that already passed the full
# typecheck/lint/test/build/migration-check/wrangler-dry-run gate in
# ci.yml. No longer triggers on cloudflare-migration (merged into main;
# builds/tests on other branches happen via ci.yml's pull_request
# trigger, but never deploy).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Reuses the existing (AWS production) Discord Application (user
      # decision, see wrangler.toml's [vars] comment), not a second
      # throwaway one, so only the two real secrets durableObject.ts's
      # Env actually declares are needed here: DISCORD_BOT_TOKEN,
      # TOKEN_ENCRYPTION_KEY. No BOT_API_KEY — that's an AWS-only
      # bearer-auth concept for the /organizers, /guilds, /pods admin
      # REST surface, which honoApp.ts deliberately never ports to Hono
      # (see its own comment on why). wrangler-action's `secrets:` input
      # runs `wrangler secret put` for each listed name using the
      # identically-named env var below — idempotent (just re-syncs the
      # same value) if nothing's changed.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          secrets: |
            DISCORD_BOT_TOKEN
            TOKEN_ENCRYPTION_KEY
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.CF_DISCORD_BOT_TOKEN }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.CF_TOKEN_ENCRYPTION_KEY }}
