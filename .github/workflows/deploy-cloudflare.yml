name: Deploy Cloudflare (migration branch)

# Scoped entirely to cloudflare-migration — never touches main, never
# competes with ci.yml/deploy-app.yml's AWS pipeline. Node 22 here (not
# 20, like ci.yml) since wrangler requires it; this has no bearing on
# the AWS side's Node 20 runtime/Dockerfile.
on:
  push:
    branches: [cloudflare-migration]

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run typecheck:cloudflare

      - run: npm run lint

      - run: npm test

      # Real DO SQLite via @cloudflare/vitest-pool-workers — added as
      # soon as Phase 1's storage layer existed to test against, rather
      # than waiting for Phase 8 as originally planned; no reason to
      # leave CI blind to this for 7 more phases once it's meaningful.
      - run: npm run test:workers

      # Validates the Worker bundles and every binding resolves, without
      # needing real Cloudflare credentials — safe to run on every push.
      - name: Dry-run deploy
        run: npx wrangler deploy --dry-run

      # TODO(Phase 9): once a second Discord Application exists and
      # CLOUDFLARE_API_TOKEN is set as a repo/environment secret, add:
      #   - name: Deploy
      #     uses: cloudflare/wrangler-action@v3
      #     with:
      #       apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #       secrets: |
      #         DISCORD_BOT_TOKEN
      #         BOT_API_KEY
      #         TOKEN_ENCRYPTION_KEY
      #     env:
      #       DISCORD_BOT_TOKEN: ${{ secrets.CF_DISCORD_BOT_TOKEN }}
      #       BOT_API_KEY: ${{ secrets.CF_BOT_API_KEY }}
      #       TOKEN_ENCRYPTION_KEY: ${{ secrets.CF_TOKEN_ENCRYPTION_KEY }}
      # Until then, real deploys are done locally via `npm run deploy:cloudflare`.
