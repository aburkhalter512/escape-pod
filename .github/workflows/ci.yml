name: CI

# Cloudflare Workers + Durable Objects is the only deployed platform now
# (AWS app/infra removed). Node 22 since wrangler requires it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run typecheck:cloudflare

      - run: npm run lint

      - run: npm test

      # Real DO SQLite via @cloudflare/vitest-pool-workers.
      - run: npm run test:workers

      # Validates the Worker bundles and every binding resolves, without
      # needing real Cloudflare credentials — safe to run on every push/PR.
      - name: Dry-run Cloudflare deploy
        run: npx wrangler deploy --dry-run
